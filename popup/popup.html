<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Focus Pro</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="mode-pomodoro" data-theme="dark">
  <div class="popup-container">
    <!-- Top Header -->
    <header class="app-header">
      <div class="header-left">
        <img src="../icons/icon32.png" alt="Logo" class="app-logo">
        <span class="app-title">Focus Pro</span>
      </div>
      <div class="header-center">
        <div class="cycle-indicator" id="cycleIndicator" title="Pomodoro cycle progress">
          <!-- Populated by JS: dots for cycles -->
        </div>
      </div>
      <div class="header-right">
        <button id="openDashboardBtn" class="icon-btn" title="Open Dashboard & Analytics">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
            <polyline points="15 3 21 3 21 9"></polyline>
            <line x1="10" y1="14" x2="21" y2="3"></line>
          </svg>
        </button>
        <button id="openSettingsBtn" class="icon-btn" title="Settings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Navigation Tabs -->
    <nav class="tab-bar">
      <button class="tab-btn active" data-tab="timer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
        <span>Timer</span>
      </button>
      <button class="tab-btn" data-tab="tasks">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"></path>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
        </svg>
        <span>Tasks</span>
        <span class="tab-badge" id="taskCountBadge" style="display:none;">0</span>
      </button>
      <button class="tab-btn" data-tab="stats">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        <span>Stats</span>
      </button>
    </nav>

    <!-- TAB 1: TIMER -->
    <section id="tab-timer" class="tab-pane active">
      <!-- Mode Switcher Pills -->
      <div class="mode-pills">
        <button class="mode-pill active" data-mode="pomodoro">Focus</button>
        <button class="mode-pill" data-mode="shortBreak">Short Break</button>
        <button class="mode-pill" data-mode="longBreak">Long Break</button>
      </div>

      <!-- Circular Timer Dial -->
      <div class="dial-container">
        <svg class="progress-ring" viewBox="0 0 220 220">
          <circle class="ring-bg" cx="110" cy="110" r="95" />
          <circle class="ring-fg" id="timerProgressRing" cx="110" cy="110" r="95" />
        </svg>
        <div class="dial-content">
          <div class="time-display" id="timeDisplay">25:00</div>
          <div class="status-label" id="statusLabel">Ready to Focus</div>
        </div>
      </div>

      <!-- Controls Row -->
      <div class="controls-row">
        <button id="resetBtn" class="control-btn secondary" title="Reset Timer (Alt+Shift+R)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
            <path d="M3 3v5h5"></path>
          </svg>
        </button>

        <button id="toggleBtn" class="control-btn primary" title="Start / Pause (Alt+Shift+P)">
          <svg id="playIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <svg id="pauseIcon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <rect x="6" y="4" width="4" height="16"></rect>
            <rect x="14" y="4" width="4" height="16"></rect>
          </svg>
          <span id="toggleBtnText">Start</span>
        </button>

        <button id="skipBtn" class="control-btn secondary" title="Skip to Next Period (Alt+Shift+S)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 4 15 12 5 20 5 4"></polygon>
            <line x1="19" y1="5" x2="19" y2="19"></line>
          </svg>
        </button>
      </div>

      <!-- Active Task Widget -->
      <div class="active-task-card" id="activeTaskCard">
        <div class="active-task-empty" id="activeTaskEmpty">
          <span class="active-task-icon">🎯</span>
          <span class="active-task-prompt">No task selected &bull; <a href="#" id="linkSelectTask">Pick a task</a></span>
        </div>
        <div class="active-task-content" id="activeTaskContent" style="display:none;">
          <input type="checkbox" id="activeTaskCheckbox" class="task-checkbox" title="Mark Done">
          <div class="active-task-info">
            <div class="active-task-title" id="activeTaskTitle">Finish project slides</div>
            <div class="active-task-pills">
              <span class="pomo-count-tag" id="activeTaskPomos">🍅 2 / 4</span>
            </div>
          </div>
          <button id="clearActiveTaskBtn" class="icon-btn-sm" title="Unlink task">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <!-- TAB 2: TASKS -->
    <section id="tab-tasks" class="tab-pane">
      <form id="addTaskForm" class="add-task-bar">
        <input type="text" id="newTaskInput" placeholder="Add a new task..." required maxlength="80">
        <div class="est-pomo-input" title="Estimated pomodoros">
          <span class="est-pomo-label">🍅</span>
          <input type="number" id="newTaskEst" value="2" min="1" max="10">
        </div>
        <button type="submit" class="add-task-btn">+</button>
      </form>

      <div class="tasks-filter-bar">
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="active">Active</button>
        <button class="filter-chip" data-filter="completed">Done</button>
      </div>

      <div class="task-list" id="taskList">
        <!-- Rendered by JS -->
      </div>
    </section>

    <!-- TAB 3: STATS -->
    <section id="tab-stats" class="tab-pane">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-num" id="statTodayPomos">0</div>
          <div class="stat-label">🍅 Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statTodayMinutes">0m</div>
          <div class="stat-label">⏱️ Focus Time</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statStreak">0</div>
          <div class="stat-label">🔥 Day Streak</div>
        </div>
        <div class="stat-card">
          <div class="stat-num" id="statGoalProgress">0/8</div>
          <div class="stat-label">🎯 Daily Goal</div>
        </div>
      </div>

      <div class="chart-box">
        <div class="chart-header">
          <span>7-Day Activity</span>
          <span class="chart-sub" id="chartTotalPomos">0 pomodoros</span>
        </div>
        <canvas id="miniWeekCanvas" width="310" height="100"></canvas>
      </div>

      <button id="viewFullDashboardBtn" class="full-stats-btn">
        <span>Detailed Analytics & History</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="9 18 15 12 9 6"></polyline>
        </svg>
      </button>
    </section>
  </div>

  <script src="../shared/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
